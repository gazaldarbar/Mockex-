name: Build Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Unit tests
        run: npm test
      - name: Install
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Generate launcher icons and splash from assets/ (Mockex branding)
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#080812' --iconBackgroundColorDark '#080812' --splashBackgroundColor '#05060f' --splashBackgroundColorDark '#05060f'
      - name: Allow notification permission (Android 13+)
        run: |
          f=android/app/src/main/AndroidManifest.xml
          grep -q POST_NOTIFICATIONS $f || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' $f
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Mockex-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
